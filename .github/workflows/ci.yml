name: Validate
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: frametrace
          POSTGRES_USER: frametrace
          POSTGRES_PASSWORD: local-development-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frametrace"
          --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r services/api/requirements-dev.lock && pip install --no-deps -e services/api
      - run: ruff check services/api scripts packages/evaluation
      - run: ruff format --check services/api scripts packages/evaluation
      - run: pytest services/api/tests -q
      - run: python scripts/check_migration.py
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npx expo export --platform android --platform ios

name: Validate
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: frametrace
          POSTGRES_USER: frametrace
          POSTGRES_PASSWORD: local-development-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frametrace"
          --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r services/api/requirements-dev.lock && pip install --no-deps -e services/api
      - run: ruff check services/api scripts packages/evaluation
      - run: ruff format --check services/api scripts packages/evaluation
      - run: pytest services/api/tests -q
      - name: Run synthetic recognition diagnostics
        run: |
          python scripts/make_fixtures.py var/evaluation-fixtures
          python packages/evaluation/benchmark.py var/evaluation-fixtures --output var/benchmark-ci.json --check-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-recognition-diagnostics
          path: var/benchmark-ci.json
          if-no-files-found: ignore
          retention-days: 14
      - run: python scripts/check_migration.py
      - run: python scripts/check_postgres_reliability.py
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: python3 ../../scripts/test_native_share.py
      - run: EXPO_OFFLINE=1 EXPO_NO_TELEMETRY=1 npx expo prebuild --no-install
      - run: npm run native:verify
      - run: npx expo install --check
      - run: npx expo export --platform android --platform ios
